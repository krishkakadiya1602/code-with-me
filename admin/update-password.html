<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Password | Code With Me</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f4f6;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #111827;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Update Password</h1>

        <input
            type="password"
            id="newPassword"
            placeholder="New Password"
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm New Password"
        >

        <button onclick="updatePassword()">
            Update Password
        </button>

    </div>


    <!-- ========================= -->
    <!-- SUPABASE -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase.js"></script>


    <script>

        // =========================================
        // UPDATE PASSWORD
        // =========================================

        async function updatePassword() {

            const password =
                document
                    .getElementById("newPassword")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            // Check password
            if (!password) {

                alert("Please enter a new password.");

                return;
            }


            // Minimum 8 characters
            if (password.length < 8) {

                alert(
                    "Password must be at least 8 characters."
                );

                return;
            }


            // Check confirmation
            if (password !== confirmPassword) {

                alert(
                    "Passwords do not match."
                );

                return;
            }


            // Update password
            const { error } =
                await supabaseClient.auth.updateUser({

                    password: password

                });


            // Error
            if (error) {

                alert(
                    "Password update failed: " +
                    error.message
                );

                return;
            }


            // Success
            alert(
                "Password updated successfully!"
            );


            // Go back to login
            window.location.href =
                "login.html";

        }

    </script>

</body>

</html>
