<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Password | Code With Me</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f3f4f6;

        }


        .password-box {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.10);

        }


        h1 {

            text-align: center;

            color: #111827;

            margin-bottom: 10px;

        }


        .description {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

            font-size: 14px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #333;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            font-size: 15px;

        }


        input:focus {

            outline: none;

            border-color: #2563eb;

        }


        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #1d4ed8;

        }


        button:disabled {

            background: #9ca3af;

            cursor: not-allowed;

        }


        .message {

            margin-top: 18px;

            text-align: center;

            font-size: 14px;

        }


        .success {

            color: #16a34a;

        }


        .error {

            color: #dc2626;

        }


        .login-link {

            display: block;

            margin-top: 20px;

            text-align: center;

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

        }


        .login-link:hover {

            text-decoration: underline;

        }

    </style>

</head>


<body>


    <div class="password-box">

        <h1>
            Update Password
        </h1>


        <p class="description">

            Enter your new admin password.

        </p>


        <form id="passwordForm">


            <label for="newPassword">

                New Password

            </label>


            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="6"
                required
            >


            <label for="confirmPassword">

                Confirm Password

            </label>


            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="6"
                required
            >


            <button
                type="submit"
                id="updateBtn">

                Update Password

            </button>


        </form>


        <div
            id="message"
            class="message">
        </div>


        <a
            href="login.html"
            class="login-link">

            Back to Admin Login

        </a>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase.js"></script>


    <script>


        // =========================================
        // UPDATE PASSWORD
        // =========================================

        document
            .getElementById("passwordForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const newPassword =
                        document
                            .getElementById("newPassword")
                            .value;


                    const confirmPassword =
                        document
                            .getElementById("confirmPassword")
                            .value;


                    const message =
                        document
                            .getElementById("message");


                    const updateBtn =
                        document
                            .getElementById("updateBtn");


                    message.textContent = "";

                    message.className =
                        "message";


                    // =================================
                    // CHECK PASSWORD
                    // =================================

                    if (newPassword.length < 6) {

                        message.textContent =
                            "Password must be at least 6 characters.";

                        message.classList.add(
                            "error"
                        );

                        return;

                    }


                    // =================================
                    // CONFIRM PASSWORD
                    // =================================

                    if (
                        newPassword !==
                        confirmPassword
                    ) {

                        message.textContent =
                            "Passwords do not match.";

                        message.classList.add(
                            "error"
                        );

                        return;

                    }


                    // Disable button

                    updateBtn.disabled = true;

                    updateBtn.textContent =
                        "Updating...";


                    // =================================
                    // UPDATE SUPABASE PASSWORD
                    // =================================

                    const {
                        error
                    } =
                        await supabaseClient.auth.updateUser({

                            password:
                                newPassword

                        });


                    // =================================
                    // ERROR
                    // =================================

                    if (error) {

                        console.error(
                            "Password update error:",
                            error
                        );


                        message.textContent =
                            "Password update failed: " +
                            error.message;


                        message.classList.add(
                            "error"
                        );


                        updateBtn.disabled = false;

                        updateBtn.textContent =
                            "Update Password";


                        return;

                    }


                    // =================================
                    // SUCCESS
                    // =================================

                    message.textContent =
                        "Password updated successfully!";


                    message.classList.add(
                        "success"
                    );


                    updateBtn.textContent =
                        "Password Updated";


                    // Wait and go to login

                    setTimeout(
                        async function() {

                            await supabaseClient
                                .auth
                                .signOut();


                            window.location.href =
                                "login.html";

                        },
                        2000
                    );

                }
            );


    </script>


</body>

</html>
