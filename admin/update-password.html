<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Password | Code With Me</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f4f6;
        }

        .box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>Change Admin Password</h2>

    <form id="passwordForm">

        <label>New Password</label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            required
        >

        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
        >

        <button type="submit">
            Update Password
        </button>

    </form>

    <p id="message"></p>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>


<script>

document
    .getElementById("passwordForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const newPassword =
            document.getElementById("newPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");


        if (newPassword !== confirmPassword) {

            message.textContent =
                "Passwords do not match.";

            message.style.color = "red";

            return;
        }


        if (newPassword.length < 8) {

            message.textContent =
                "Password must be at least 8 characters.";

            message.style.color = "red";

            return;
        }


        const { error } =
            await supabaseClient.auth.updateUser({

                password: newPassword

            });


        if (error) {

            console.error(error);

            message.textContent =
                error.message;

            message.style.color = "red";

            return;
        }


        message.textContent =
            "Password updated successfully!";

        message.style.color = "green";


        setTimeout(() => {

            window.location.href =
                "login.html";

        }, 1500);

    });

</script>

</body>

</html>
