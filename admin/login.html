<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Code With Me</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #2563eb
                );
        }


        .login-box {
            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.25);
        }


        .logo {
            text-align: center;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .logo span {
            color: #2563eb;
        }


        .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }


        input {
            width: 100%;

            padding: 13px;

            border:
                1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }


        input:focus {
            outline: none;

            border-color: #2563eb;
        }


        .login-btn,
        .reset-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .login-btn:hover,
        .reset-btn:hover {
            background: #1d4ed8;
        }


        .login-btn:disabled,
        .reset-btn:disabled {
            background: #93c5fd;

            cursor: not-allowed;
        }


        .error {
            color: #dc2626;

            text-align: center;

            margin-top: 15px;

            display: none;

            font-size: 14px;
        }


        .success {
            color: #16a34a;

            text-align: center;

            margin-top: 15px;

            display: none;

            font-size: 14px;
        }


        .forgot {
            text-align: right;

            margin-top: -10px;

            margin-bottom: 20px;
        }


        .forgot a {
            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            cursor: pointer;
        }


        .forgot a:hover {
            text-decoration: underline;
        }


        .reset-section {
            display: none;
        }


        .reset-title {
            text-align: center;

            font-size: 22px;

            margin-bottom: 10px;
        }


        .reset-description {
            text-align: center;

            color: #666;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        .back-login {
            text-align: center;

            margin-top: 20px;
        }


        .back-login a {
            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            cursor: pointer;
        }


        .back-login a:hover {
            text-decoration: underline;
        }


        .back {
            text-align: center;

            margin-top: 20px;
        }


        .back a {
            color: #2563eb;

            text-decoration: none;

            font-size: 14px;
        }


        .back a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="login-box">


    <!-- =========================================
         LOGIN SECTION
    ========================================== -->

    <div id="loginSection">


        <div class="logo">

            Code <span>With Me</span>

        </div>


        <p class="subtitle">

            Administrator Login

        </p>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">

                    Email

                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- FORGOT PASSWORD -->

            <div class="forgot">

                <a id="forgotPasswordLink">

                    Forgot Password?

                </a>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >

                Login

            </button>


            <p
                id="error"
                class="error"
            ></p>


            <p
                id="success"
                class="success"
            >

                Login successful. Redirecting...

            </p>


        </form>


        <div class="back">

            <a href="../index.html">

                ← Back to Website

            </a>

        </div>


    </div>



    <!-- =========================================
         FORGOT PASSWORD SECTION
    ========================================== -->

    <div
        id="resetSection"
        class="reset-section"
    >


        <div class="logo">

            Code <span>With Me</span>

        </div>


        <h2 class="reset-title">

            Forgot Password?

        </h2>


        <p class="reset-description">

            Enter your admin email address.
            We will send you a password reset link.

        </p>


        <form id="resetForm">


            <div class="form-group">

                <label for="resetEmail">

                    Admin Email

                </label>


                <input
                    type="email"
                    id="resetEmail"
                    placeholder="Enter admin email"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                class="reset-btn"
                id="resetButton"
            >

                Send Reset Link

            </button>


            <p
                id="resetError"
                class="error"
            ></p>


            <p
                id="resetSuccess"
                class="success"
            ></p>


        </form>


        <div class="back-login">

            <a id="backToLogin">

                ← Back to Login

            </a>

        </div>


    </div>


</div>



<!-- =========================================
     SUPABASE JAVASCRIPT LIBRARY
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =========================================
     YOUR SUPABASE CONFIGURATION
========================================== -->

<script src="../js/supabase.js"></script>



<script>


    // =========================================
    // GET HTML ELEMENTS
    // =========================================

    const loginSection =
        document.getElementById("loginSection");


    const resetSection =
        document.getElementById("resetSection");


    const loginForm =
        document.getElementById("loginForm");


    const loginButton =
        document.getElementById("loginButton");


    const errorMessage =
        document.getElementById("error");


    const successMessage =
        document.getElementById("success");


    const forgotPasswordLink =
        document.getElementById("forgotPasswordLink");


    const resetForm =
        document.getElementById("resetForm");


    const resetButton =
        document.getElementById("resetButton");


    const resetError =
        document.getElementById("resetError");


    const resetSuccess =
        document.getElementById("resetSuccess");


    const backToLogin =
        document.getElementById("backToLogin");



    // =========================================
    // SHOW FORGOT PASSWORD SECTION
    // =========================================

    forgotPasswordLink.addEventListener(
        "click",
        function () {

            loginSection.style.display =
                "none";

            resetSection.style.display =
                "block";

            resetError.style.display =
                "none";

            resetSuccess.style.display =
                "none";

            // Copy login email to reset email
            const loginEmail =
                document.getElementById("email").value.trim();

            if (loginEmail) {

                document.getElementById("resetEmail").value =
                    loginEmail;

            }

        }
    );



    // =========================================
    // BACK TO LOGIN
    // =========================================

    backToLogin.addEventListener(
        "click",
        function () {

            resetSection.style.display =
                "none";

            loginSection.style.display =
                "block";

            resetError.style.display =
                "none";

            resetSuccess.style.display =
                "none";

        }
    );



    // =========================================
    // ADMIN LOGIN
    // =========================================

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            // Get email

            const email =
                document
                .getElementById("email")
                .value
                .trim();


            // Get password

            const password =
                document
                .getElementById("password")
                .value;


            // Reset messages

            errorMessage.style.display =
                "none";

            successMessage.style.display =
                "none";


            // Disable button

            loginButton.disabled =
                true;

            loginButton.textContent =
                "Logging in...";


            try {


                // Supabase login

                const { data, error } =
                    await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


                // Check error

                if (error) {

                    console.error(
                        "Login Error:",
                        error
                    );


                    errorMessage.textContent =
                        "Invalid email or password.";


                    errorMessage.style.display =
                        "block";


                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "Login";


                    return;

                }



                // Login successful

                console.log(
                    "Logged in user:",
                    data.user
                );


                successMessage.style.display =
                    "block";


                loginButton.textContent =
                    "Success!";


                // Go to dashboard

                setTimeout(
                    function () {

                        window.location.href =
                            "dashboard.html";

                    },
                    500
                );


            }


            catch (error) {

                console.error(
                    "Unexpected Error:",
                    error
                );


                errorMessage.textContent =
                    "Something went wrong. Please try again.";


                errorMessage.style.display =
                    "block";


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "Login";

            }

        }
    );



    // =========================================
    // FORGOT PASSWORD / RESET PASSWORD
    // =========================================

    resetForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            // Get reset email

            const email =
                document
                .getElementById("resetEmail")
                .value
                .trim();


            // Reset messages

            resetError.style.display =
                "none";

            resetSuccess.style.display =
                "none";


            // Disable button

            resetButton.disabled =
                true;

            resetButton.textContent =
                "Sending...";


            try {


                // Password reset redirect URL

                const redirectURL =
                    "https://krishkakadiya1602.github.io/code-with-me/admin/update-password.html";


                // Send password reset email

                const { error } =
                    await supabaseClient.auth
                    .resetPasswordForEmail(
                        email,
                        {
                            redirectTo: redirectURL
                        }
                    );


                // Check error

                if (error) {

                    console.error(
                        "Reset Password Error:",
                        error
                    );


                    resetError.textContent =
                        error.message;


                    resetError.style.display =
                        "block";


                    resetButton.disabled =
                        false;


                    resetButton.textContent =
                        "Send Reset Link";


                    return;

                }


                // Success

                resetSuccess.textContent =
                    "Password reset link has been sent to your email. Please check your inbox.";


                resetSuccess.style.display =
                    "block";


                resetButton.disabled =
                    false;


                resetButton.textContent =
                    "Send Reset Link";


            }


            catch (error) {

                console.error(
                    "Unexpected Reset Error:",
                    error
                );


                resetError.textContent =
                    "Something went wrong. Please try again.";


                resetError.style.display =
                    "block";


                resetButton.disabled =
                    false;


                resetButton.textContent =
                    "Send Reset Link";

            }

        }
    );


</script>


</body>

</html>
