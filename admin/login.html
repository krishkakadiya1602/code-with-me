<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Code With Me</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827, #2563eb);
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error {
            color: #dc2626;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            Code <span>With Me</span>
        </div>

        <p class="subtitle">
            Administrator Login
        </p>

        <form onsubmit="login(event)">

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <p id="error" class="error">
                Invalid email or password.
            </p>

        </form>

        <div class="back">
            <a href="../index.html">
                ← Back to Website
            </a>
        </div>

    </div>


    <script>

        function login(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            /*
             * DEMO ONLY
             * Real authentication should be done
             * on a backend server.
             */

            const adminEmail = "admin@example.com";
            const adminPassword = "Admin@123";

            if (
                email === adminEmail &&
                password === adminPassword
            ) {

                sessionStorage.setItem(
                    "adminLoggedIn",
                    "true"
                );

                window.location.href =
                    "dashboard.html";

            } else {

                document.getElementById("error").style.display =
                    "block";

            }

        }

    </script>

</body>

</html>
