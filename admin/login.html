<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Code With Me</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827, #2563eb);
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .login-btn:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .error {
            color: #dc2626;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .success {
            color: #16a34a;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo">
            Code <span>With Me</span>
        </div>

        <p class="subtitle">
            Administrator Login
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Login
            </button>


            <p id="error" class="error"></p>

            <p id="success" class="success">
                Login successful...
            </p>

        </form>


        <div class="back">

            <a href="../index.html">
                ← Back to Website
            </a>

        </div>

    </div>


    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Your Supabase Configuration -->
    <script src="../js/supabase.js"></script>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const errorMessage =
            document.getElementById("error");

        const successMessage =
            document.getElementById("success");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email").value.trim();


                const password =
                    document.getElementById("password").value;


                errorMessage.style.display = "none";

                successMessage.style.display = "none";

                loginButton.disabled = true;

                loginButton.textContent = "Logging in...";


                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {

                    console.error(error);

                    errorMessage.textContent =
                        "Invalid email or password.";

                    errorMessage.style.display =
                        "block";

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";

                    return;
                }


                successMessage.style.display =
                    "block";


                window.location.href =
                    "dashboard.html";

            }
        );

    </script>

</body>

</html>
